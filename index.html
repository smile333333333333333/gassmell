<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>GAS: THE ESCAPE</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#game{
    width:100vw;
    height:100vh;
    display:block;
    background:#202020;
}

#menu{
    position:fixed;
    inset:0;
    background:#101010;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:100;
    text-align:center;
}

#menu h1{
    margin:0;
    font-size:clamp(50px,12vw,100px);
    color:#ffcc00;
    text-shadow:0 0 20px #ffcc00;
}

#menu p{
    color:#aaa;
    margin:10px 0 30px;
}

button{
    font-size:24px;
    font-weight:bold;
    padding:18px 42px;
    background:#222;
    color:#ffcc00;
    border:3px solid #ffcc00;
    border-radius:10px;
    cursor:pointer;
}

button:active{
    transform:scale(.95);
}

#hud{
    position:fixed;
    top:10px;
    left:10px;
    z-index:20;
    display:none;
    color:white;
    font-size:18px;
    font-weight:bold;
    text-shadow:2px 2px #000;
}

.hudBox{
    display:inline-block;
    padding:7px 10px;
    margin:3px;
    background:rgba(0,0,0,.65);
    border:2px solid #555;
    border-radius:5px;
}

#healthBar{
    display:inline-block;
    width:150px;
    height:16px;
    background:#222;
    border:2px solid white;
    vertical-align:middle;
}

#healthFill{
    width:100%;
    height:100%;
    background:#32d65a;
}

#bossBar{
    position:fixed;
    z-index:25;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    width:min(500px,80vw);
    height:25px;
    background:#222;
    border:3px solid #ff4444;
    display:none;
}

#bossFill{
    height:100%;
    width:100%;
    background:#dd2222;
}

#message{
    position:fixed;
    z-index:30;
    top:35%;
    left:0;
    width:100%;
    text-align:center;
    color:white;
    font-size:clamp(30px,7vw,70px);
    font-weight:bold;
    text-shadow:4px 4px #000;
    pointer-events:none;
}

#gameOver{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.88);
    color:white;
    text-align:center;
}

#gameOver h1{
    color:#e33;
    font-size:60px;
    margin:0 0 15px;
}

#finalScore{
    font-size:24px;
    margin-bottom:25px;
}

#mobile{
    position:fixed;
    inset:0;
    z-index:50;
    display:none;
    pointer-events:none;
}

.mobileButton{
    position:absolute;
    width:65px;
    height:65px;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    border:2px solid rgba(255,255,255,.4);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:auto;
    touch-action:none;
    font-weight:bold;
}

#up{
    left:80px;
    bottom:145px;
}

#down{
    left:80px;
    bottom:25px;
}

#left{
    left:10px;
    bottom:85px;
}

#right{
    left:150px;
    bottom:85px;
}

#shoot{
    right:30px;
    bottom:50px;
    width:90px;
    height:90px;
    background:rgba(200,40,40,.3);
}

#grenade{
    right:40px;
    bottom:155px;
    font-size:12px;
    background:rgba(40,180,70,.3);
}

#reload{
    right:140px;
    bottom:40px;
    font-size:12px;
}

@media(pointer:coarse){
    #mobile{
        display:block;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

    <h1>GAS</h1>

    <p>THE ESCAPE</p>

    <button id="startButton">START GAME</button>

</div>


<div id="hud">

    <span class="hudBox">
        HP
        <span id="healthBar">
            <span id="healthFill"></span>
        </span>
    </span>

    <span class="hudBox">
        AMMO:
        <span id="ammo">12</span> /
        <span id="reserve">120</span>
    </span>

    <span class="hudBox">
        GRENADES:
        <span id="grenades">3</span>
    </span>

    <span class="hudBox">
        WAVE:
        <span id="wave">1</span>
    </span>

    <span class="hudBox">
        SCORE:
        <span id="score">0</span>
    </span>

</div>


<div id="bossBar">
    <div id="bossFill"></div>
</div>


<div id="message"></div>


<div id="gameOver">

    <h1>GAME OVER</h1>

    <div id="finalScore">
        Score: 0
    </div>

    <button id="restartButton">
        PLAY AGAIN
    </button>

</div>


<div id="mobile">

    <div class="mobileButton" id="up">▲</div>
    <div class="mobileButton" id="down">▼</div>
    <div class="mobileButton" id="left">◀</div>
    <div class="mobileButton" id="right">▶</div>

    <div class="mobileButton" id="shoot">FIRE</div>

    <div class="mobileButton" id="grenade">
        GRENADE
    </div>

    <div class="mobileButton" id="reload">
        RELOAD
    </div>

</div>


<script>

/* ============================================================
   BASIC SETUP
============================================================ */

var canvas =
    document.getElementById("game");

var ctx =
    canvas.getContext("2d");

var W=0;
var H=0;

function resize(){

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    W=canvas.width;
    H=canvas.height;
}

window.addEventListener("resize",resize);

resize();


/* ============================================================
   GAME VARIABLES
============================================================ */

var playing=false;

var score=0;

var wave=1;

var cameraX=0;
var cameraY=0;

var lastTime=0;

var enemies=[];
var bullets=[];
var particles=[];
var grenadesList=[];
var pickups=[];
var walls=[];

var enemiesToSpawn=0;
var spawnTimer=0;

var boss=null;


/* ============================================================
   WORLD
============================================================ */

var WORLD_WIDTH=3200;
var WORLD_HEIGHT=2400;


/* ============================================================
   PLAYER
============================================================ */

var player={
    x:WORLD_WIDTH/2,
    y:WORLD_HEIGHT/2,

    radius:20,

    speed:260,

    health:100,
    maxHealth:100,

    ammo:12,
    maxAmmo:12,

    reserve:120,

    grenades:3,

    shootTimer:0,

    reloadTimer:0,

    invincible:0
};


/* ============================================================
   INPUT
============================================================ */

var keys={};

var mouseX=W/2;
var mouseY=H/2;

var mouseDown=false;

var mobile={
    up:false,
    down:false,
    left:false,
    right:false,
    shoot:false
};


window.addEventListener("keydown",function(e){

    keys[e.key.toLowerCase()]=true;

    if(e.key.toLowerCase()=="r"){
        reload();
    }

    if(e.key.toLowerCase()=="g"){
        throwGrenade();
    }

});


window.addEventListener("keyup",function(e){

    keys[e.key.toLowerCase()]=false;

});


canvas.addEventListener("mousemove",function(e){

    mouseX=e.clientX;
    mouseY=e.clientY;

});


canvas.addEventListener("mousedown",function(e){

    if(e.button===0){
        mouseDown=true;
    }

});


window.addEventListener("mouseup",function(e){

    if(e.button===0){
        mouseDown=false;
    }

});


/* ============================================================
   MOBILE BUTTONS
============================================================ */

function holdButton(id,name){

    var button=
        document.getElementById(id);

    function down(e){

        e.preventDefault();

        mobile[name]=true;
    }

    function up(e){

        e.preventDefault();

        mobile[name]=false;
    }

    button.addEventListener(
        "touchstart",
        down,
        {passive:false}
    );

    button.addEventListener(
        "touchend",
        up,
        {passive:false}
    );

    button.addEventListener(
        "touchcancel",
        up,
        {passive:false}
    );

    button.addEventListener(
        "mousedown",
        down
    );

    button.addEventListener(
        "mouseup",
        up
    );

    button.addEventListener(
        "mouseleave",
        up
    );
}


holdButton("up","up");
holdButton("down","down");
holdButton("left","left");
holdButton("right","right");
holdButton("shoot","shoot");


document
.getElementById("grenade")
.addEventListener(
    "click",
    throwGrenade
);


document
.getElementById("reload")
.addEventListener(
    "click",
    reload
);


/* ============================================================
   UTILITY FUNCTIONS
============================================================ */

function random(min,max){

    return Math.random()*(max-min)+min;
}


function randomInt(min,max){

    return Math.floor(
        Math.random()*(max-min+1)+min
    );
}


function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );
}


/* ============================================================
   WALLS
============================================================ */

function createWalls(){

    walls=[];

    for(var i=0;i<45;i++){

        var wall={
            x:randomInt(100,WORLD_WIDTH-300),
            y:randomInt(100,WORLD_HEIGHT-250),
            width:randomInt(80,230),
            height:randomInt(60,180)
        };

        if(
            Math.abs(
                wall.x-player.x
            )<400 &&
            Math.abs(
                wall.y-player.y
            )<400
        ){
            continue;
        }

        walls.push(wall);
    }

}


/* ============================================================
   COLLISION
============================================================ */

function circleWallCollision(
    x,
    y,
    radius,
    wall
){

    var closestX=
        clamp(
            x,
            wall.x,
            wall.x+wall.width
        );

    var closestY=
        clamp(
            y,
            wall.y,
            wall.y+wall.height
        );

    var dx=x-closestX;
    var dy=y-closestY;

    return (
        dx*dx+dy*dy
        <
        radius*radius
    );
}


function blocked(x,y,radius){

    if(
        x-radius<0 ||
        y-radius<0 ||
        x+radius>WORLD_WIDTH ||
        y+radius>WORLD_HEIGHT
    ){
        return true;
    }

    for(
        var i=0;
        i<walls.length;
        i++
    ){

        if(
            circleWallCollision(
                x,
                y,
                radius,
                walls[i]
            )
        ){
            return true;
        }
    }

    return false;
}


function moveObject(
    object,
    dx,
    dy
){

    if(
        !blocked(
            object.x+dx,
            object.y,
            object.radius
        )
    ){
        object.x+=dx;
    }

    if(
        !blocked(
            object.x,
            object.y+dy,
            object.radius
        )
    ){
        object.y+=dy;
    }
}


/* ============================================================
   START GAME
============================================================ */

function START_GAME(){

    playing=true;

    score=0;

    wave=1;

    enemies=[];
    bullets=[];
    particles=[];
    grenadesList=[];
    pickups=[];

    boss=null;

    player.x=
        WORLD_WIDTH/2;

    player.y=
        WORLD_HEIGHT/2;

    player.health=100;

    player.ammo=12;

    player.reserve=120;

    player.grenades=3;

    player.shootTimer=0;

    player.reloadTimer=0;

    player.invincible=0;

    createWalls();

    document
    .getElementById("menu")
    .style.display="none";

    document
    .getElementById("gameOver")
    .style.display="none";

    document
    .getElementById("hud")
    .style.display="block";

    document
    .getElementById("bossBar")
    .style.display="none";

    showMessage("WAVE 1");

    startWave();

    lastTime=
        performance.now();

    requestAnimationFrame(
        GAME_LOOP
    );
}


/* ============================================================
   BUTTONS
============================================================ */

document
.getElementById("startButton")
.addEventListener(
    "click",
    START_GAME
);


document
.getElementById("restartButton")
.addEventListener(
    "click",
    START_GAME
);


/* ============================================================
   MESSAGE
============================================================ */

var messageTimer=0;

function showMessage(text){

    document
    .getElementById("message")
    .textContent=text;

    messageTimer=2;
}


/* ============================================================
   WAVES
============================================================ */

function startWave(){

    enemiesToSpawn=
        4+wave*3;

    spawnTimer=0;

    showMessage(
        "WAVE "+wave
    );

}


function spawnEnemy(){

    var side=
        randomInt(0,3);

    var x;
    var y;

    if(side===0){

        x=40;
        y=random(
            40,
            WORLD_HEIGHT-40
        );

    }else if(side===1){

        x=WORLD_WIDTH-40;
        y=random(
            40,
            WORLD_HEIGHT-40
        );

    }else if(side===2){

        x=random(
            40,
            WORLD_WIDTH-40
        );

        y=40;

    }else{

        x=random(
            40,
            WORLD_WIDTH-40
        );

        y=WORLD_HEIGHT-40;
    }


    var type=Math.random();

    var enemy;


    if(
        type<.18 &&
        wave>=3
    ){

        enemy={
            type:"fast",

            x:x,
            y:y,

            radius:15,

            speed:190,

            health:45+wave*4,

            maxHealth:45+wave*4,

            damage:12,

            color:"#ff8800",

            attack:0
        };

    }else if(
        type<.35 &&
        wave>=2
    ){

        enemy={
            type:"tank",

            x:x,
            y:y,

            radius:28,

            speed:65,

            health:150+wave*10,

            maxHealth:150+wave*10,

            damage:20,

            color:"#a24cff",

            attack:0
        };

    }else{

        enemy={
            type:"normal",

            x:x,
            y:y,

            radius:19,

            speed:95,

            health:60+wave*5,

            maxHealth:60+wave*5,

            damage:10,

            color:"#e54848",

            attack:0
        };
    }

    enemies.push(enemy);

    enemiesToSpawn--;
}


/* ============================================================
   BOSS
============================================================ */

function spawnBoss(){

    boss={

        x:WORLD_WIDTH/2,

        y:150,

        radius:65,

        speed:75,

        health:
            1200+
            wave*100,

        maxHealth:
            1200+
            wave*100,

        attack:0,

        shoot:1

    };

    document
    .getElementById("bossBar")
    .style.display="block";

    showMessage(
        "THE GAS DIRECTOR"
    );
}


/* ============================================================
   SHOOT
============================================================ */

function shoot(){

    if(!playing){
        return;
    }

    if(player.reloadTimer>0){
        return;
    }

    if(player.shootTimer>0){
        return;
    }

    if(player.ammo<=0){

        reload();

        return;
    }


    var targetX=
        mouseX+cameraX;

    var targetY=
        mouseY+cameraY;


    var dx=
        targetX-player.x;

    var dy=
        targetY-player.y;

    var length=
        Math.sqrt(
            dx*dx+dy*dy
        );

    if(length===0){
        length=1;
    }

    dx/=length;
    dy/=length;


    bullets.push({

        x:player.x+dx*25,

        y:player.y+dy*25,

        vx:dx*850,

        vy:dy*850,

        radius:5,

        damage:35,

        life:1.5,

        friendly:true

    });


    player.ammo--;

    player.shootTimer=.13;

}


/* ============================================================
   RELOAD
============================================================ */

function reload(){

    if(!playing){
        return;
    }

    if(player.reloadTimer>0){
        return;
    }

    if(player.ammo>=player.maxAmmo){
        return;
    }

    if(player.reserve<=0){
        return;
    }

    player.reloadTimer=1.1;
}


/* ============================================================
   GRENADE
============================================================ */

function throwGrenade(){

    if(!playing){
        return;
    }

    if(player.grenades<=0){
        return;
    }


    var targetX=
        mouseX+cameraX;

    var targetY=
        mouseY+cameraY;


    var dx=
        targetX-player.x;

    var dy=
        targetY-player.y;

    var length=
        Math.sqrt(
            dx*dx+dy*dy
        );

    if(length===0){
        length=1;
    }

    dx/=length;
    dy/=length;


    grenadesList.push({

        x:player.x,

        y:player.y,

        vx:dx*500,

        vy:dy*500,

        timer:1.1,

        radius:9

    });


    player.grenades--;
}


/* ============================================================
   PARTICLES
============================================================ */

function particle(
    x,
    y,
    color
){

    particles.push({

        x:x,

        y:y,

        vx:random(-180,180),

        vy:random(-180,180),

        size:random(2,6),

        life:.5,

        maxLife:.5,

        color:color

    });
}


function explosion(
    x,
    y,
    size
){

    for(
        var i=0;
        i<size;
        i++
    ){

        var angle=
            random(
                0,
                Math.PI*2
            );

        var speed=
            random(
                50,
                450
            );

        particles.push({

            x:x,

            y:y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            size:
                random(2,9),

            life:
                random(.3,.9),

            maxLife:.9,

            color:
                Math.random()<.5
                ?"orange"
                :"yellow"

        });
    }
}


/* ============================================================
   DAMAGE
============================================================ */

function damagePlayer(amount){

    if(player.invincible>0){
        return;
    }

    player.health-=amount;

    player.invincible=.35;

    for(
        var i=0;
        i<8;
        i++
    ){
        particle(
            player.x,
            player.y,
            "red"
        );
    }

    if(player.health<=0){

        END_GAME();
    }
}


/* ============================================================
   UPDATE PLAYER
============================================================ */

function updatePlayer(dt){

    var dx=0;
    var dy=0;


    if(
        keys["w"] ||
        keys["arrowup"] ||
        mobile.up
    ){
        dy--;
    }


    if(
        keys["s"] ||
        keys["arrowdown"] ||
        mobile.down
    ){
        dy++;
    }


    if(
        keys["a"] ||
        keys["arrowleft"] ||
        mobile.left
    ){
        dx--;
    }


    if(
        keys["d"] ||
        keys["arrowright"] ||
        mobile.right
    ){
        dx++;
    }


    if(dx!==0 || dy!==0){

        var length=
            Math.sqrt(
                dx*dx+
                dy*dy
            );

        dx/=length;
        dy/=length;

        moveObject(
            player,
            dx*
            player.speed*
            dt,

            dy*
            player.speed*
            dt
        );
    }


    if(
        mouseDown ||
        mobile.shoot
    ){
        shoot();
    }


    if(player.shootTimer>0){

        player.shootTimer-=dt;
    }


    if(player.reloadTimer>0){

        player.reloadTimer-=dt;

        if(
            player.reloadTimer<=0
        ){
