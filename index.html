<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HIGHWAY RUSH</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
}

body{
  margin:0;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#3b3b3b;
}

#road{
  position:absolute;
  left:12%;
  width:76%;
  height:100%;
  background:#444;
  border-left:10px solid #777;
  border-right:10px solid #777;
  overflow:hidden;
}

.laneLine{
  position:absolute;
  width:8px;
  height:80px;
  background:#eee;
  left:33.33%;
  transform:translateX(-50%);
  opacity:.8;
}

.laneLine.two{
  left:66.66%;
}

#player{
  position:absolute;
  width:48px;
  height:82px;
  background:#1268d6;
  border-radius:9px;
  left:50%;
  bottom:35px;
  transform:translateX(-50%);
  z-index:10;
  box-shadow:0 4px 8px #111;
}

#player:before,
#player:after{
  content:"";
  position:absolute;
  width:10px;
  height:25px;
  background:#111;
  top:13px;
  border-radius:4px;
}

#player:before{left:-6px}
#player:after{right:-6px}

.window{
  position:absolute;
  width:34px;
  height:24px;
  left:7px;
  top:9px;
  background:#9ed8ee;
  border-radius:5px;
}

.light{
  position:absolute;
  width:9px;
  height:6px;
  background:#fff;
  bottom:5px;
  border-radius:2px;
}

.light.left{left:7px}
.light.right{right:7px}

.car{
  position:absolute;
  width:46px;
  height:78px;
  border-radius:9px;
  z-index:5;
  box-shadow:0 3px 7px #111;
}

.car .window{
  top:9px;
}

.bubble{
  position:absolute;
  white-space:nowrap;
  background:white;
  color:#111;
  padding:7px 10px;
  border-radius:12px;
  font-weight:bold;
  font-size:13px;
  z-index:30;
  transform:translate(-50%,-100%);
  left:50%;
  top:-7px;
  box-shadow:0 2px 5px #111;
  animation:pop .15s ease-out;
}

.bubble:after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-7px;
  transform:translateX(-50%);
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-top:8px solid white;
}

@keyframes pop{
  from{transform:translate(-50%,-100%) scale(.6)}
  to{transform:translate(-50%,-100%) scale(1)}
}

#hud{
  position:absolute;
  top:12px;
  left:12px;
  z-index:50;
  color:white;
  font-size:18px;
  text-shadow:2px 2px 3px #000;
}

#hud div{
  margin-bottom:5px;
}

#startScreen,
#gameOver{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.78);
  color:white;
  text-align:center;
}

#startScreen h1,
#gameOver h1{
  font-size:42px;
  margin:0 0 10px;
  letter-spacing:3px;
}

#startScreen p{
  max-width:500px;
  padding:0 20px;
  line-height:1.5;
}

button{
  border:0;
  background:#1684ff;
  color:white;
  padding:15px 35px;
  border-radius:8px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

#controls{
  position:absolute;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  z-index:60;
  display:flex;
  gap:15px;
}

.control{
  width:70px;
  height:55px;
  border-radius:10px;
  border:2px solid white;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:25px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hidden{
  display:none !important;
}

#flash{
  position:absolute;
  inset:0;
  z-index:90;
  background:#f00;
  opacity:0;
  pointer-events:none;
}

@media(max-width:600px){
  #road{
    left:5%;
    width:90%;
  }

  #startScreen h1,
  #gameOver h1{
    font-size:32px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="road">
    <div id="lines"></div>
    <div id="player">
      <div class="window"></div>
      <div class="light left"></div>
      <div class="light right"></div>
    </div>
  </div>

  <div id="hud">
    <div>🏁 DISTANCE: <span id="distance">0</span> m</div>
    <div>⚡ SPEED: <span id="speed">80</span> km/h</div>
    <div>🏆 SCORE: <span id="score">0</span></div>
  </div>

  <div id="controls">
    <div class="control" id="leftBtn">◀</div>
    <div class="control" id="rightBtn">▶</div>
  </div>

  <div id="flash"></div>

  <div id="startScreen">
    <h1>HIGHWAY RUSH</h1>
    <p>
      You're not on a racetrack.<br>
      You're on a busy highway.
      <br><br>
      Dodge traffic, pass cars and survive as long as you can.
      Some drivers won't be very happy when you pass them...
    </p>
    <button id="startBtn">START DRIVING</button>
  </div>

  <div id="gameOver" class="hidden">
    <h1>CRASH!</h1>
    <p>Distance: <span id="finalDistance">0</span> m</p>
    <p>Score: <span id="finalScore">0</span></p>
    <button id="restartBtn">TRY AGAIN</button>
  </div>

</div>

<script>
const road = document.getElementById("road");
const player = document.getElementById("player");

const distanceText = document.getElementById("distance");
const speedText = document.getElementById("speed");
const scoreText = document.getElementById("score");

const startScreen = document.getElementById("startScreen");
const gameOver = document.getElementById("gameOver");

const finalDistance = document.getElementById("finalDistance");
const finalScore = document.getElementById("finalScore");

const flash = document.getElementById("flash");

let running = false;
let lastTime = 0;
let distance = 0;
let score = 0;
let speed = 8;

let playerLane = 1;
let cars = [];
let laneLines = [];

const lanePositions = ["16.66%","50%","83.33%"];

const colors = [
  "#d22",
  "#eee",
  "#222",
  "#e8b51d",
  "#27a852",
  "#9a45c9",
  "#f47c20",
  "#1684d8"
];

const thingsDriversSay = [
  "HEY!",
  "WATCH IT!",
  "MOVE!",
  "SLOW DOWN!",
  "HEY, THAT WAS CLOSE!",
  "WHAT ARE YOU DOING?!",
  "COME ON!",
  "HEY!",
  "YOU CUT ME OFF!",
  "GET OUT OF THE WAY!"
];

function createRoadLines(){
  for(let i=0;i<12;i++){
    let a=document.createElement("div");
    a.className="laneLine";
    a.style.top=(i*110-100)+"px";
    road.appendChild(a);
    laneLines.push(a);

    let b=document.createElement("div");
    b.className="laneLine two";
    b.style.top=(i*110-100)+"px";
    road.appendChild(b);
    laneLines.push(b);
  }
}

function moveRoadLines(delta){
  for(let line of laneLines){
    let y=parseFloat(line.style.top);
    y += speed*delta*.12;

    if(y>window.innerHeight+100){
      y=-100;
    }

    line.style.top=y+"px";
  }
}

function createCar(){
  if(!running) return;

  const car=document.createElement("div");
  car.className="car";

  let lane=Math.floor(Math.random()*3);

  car.dataset.lane=lane;
  car.style.left=lanePositions[lane];
  car.style.transform="translateX(-50%)";
  car.style.top="-100px";
  car.style.background=colors[Math.floor(Math.random()*colors.length)];

  let win=document.createElement("div");
  win.className="window";
  car.appendChild(win);

  let light1=document.createElement("div");
  light1.className="light left";
  car.appendChild(light1);

  let light2=document.createElement("div");
  light2.className="light right";
  car.appendChild(light2);

  road.appendChild(car);

  cars.push({
    element:car,
    lane:lane,
    y:-100,
    passed:false,
    bubbleTimer:null
  });
}

function showBubble(carData){
  if(!carData.element.parentNode) return;

  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.textContent=
    thingsDriversSay[
      Math.floor(Math.random()*thingsDriversSay.length)
    ];

  carData.element.appendChild(bubble);

  setTimeout(()=>{
    if(bubble.parentNode){
      bubble.remove();
    }
  },2200);
}

function moveCars(delta){
  for(let i=cars.length-1;i>=0;i--){
    let c=cars[i];

    c.y += speed*delta*.16;
    c.element.style.top=c.y+"px";

    /*
      If the player passes a car, trigger its reaction.
    */
    if(!c.passed && c.y > player.offsetTop + player.offsetHeight){
      c.passed=true;

      if(c.lane===playerLane){
        score+=25;
        showBubble(c);
      }else{
        score+=10;
      }
    }

    if(c.y>window.innerHeight+120){
      c.element.remove();
      cars.splice(i,1);
    }
  }
}

function collision(a,b){
  const ar=a.getBoundingClientRect();
  const br=b.getBoundingClientRect();

  return !(
    ar.right<br.left+8 ||
    ar.left>br.right-8 ||
    ar.bottom<br.top+10 ||
    ar.top>br.bottom-10
  );
}

function checkCollisions(){
  for(let c of cars){
    if(collision(player,c.element)){
      crash();
      return;
    }
  }
}

function crash(){
  running=false;

  flash.style.opacity=".6";

  setTimeout(()=>{
    flash.style.opacity="0";
  },180);

  finalDistance.textContent=Math.floor(distance);
  finalScore.textContent=Math.floor(score);

  gameOver.classList.remove("hidden");
}

function updateHUD(){
  distanceText.textContent=Math.floor(distance);
  speedText.textContent=Math.floor(speed*10);
  scoreText.textContent=Math.floor(score);
}

function gameLoop(time){
  if(!running) return;

  if(!lastTime) lastTime=time;

  let delta=(time-lastTime)/16.67;
  lastTime=time;

  distance += speed*delta*.08;

  /*
    Gradually get faster.
  */
  speed += .003*delta;

  moveRoadLines(delta);
  moveCars(delta);
  checkCollisions();
  updateHUD();

  requestAnimationFrame(gameLoop);
}

function startGame(){
  cars.forEach(c=>c.element.remove());
  cars=[];

  distance=0;
  score=0;
  speed=8;

  playerLane=1;
  player.style.left=lanePositions[playerLane];

  gameOver.classList.add("hidden");
  startScreen.classList.add("hidden");

  running=true;
  lastTime=0;

  requestAnimationFrame(gameLoop);
}

/*
  Spawn traffic at random intervals.
*/
let spawnTimer=null;

function trafficSpawner(){
  if(spawnTimer) clearInterval(spawnTimer);

  spawnTimer=setInterval(()=>{
    if(running){
      createCar();

      /*
        Sometimes spawn a second car.
      */
      if(Math.random()<.25){
        setTimeout(()=>{
          if(running) createCar();
        },250);
      }
    }
  },900);
}

function moveLeft(){
  if(!running) return;

  if(playerLane>0){
    playerLane--;
    player.style.left=lanePositions[playerLane];
  }
}

function moveRight(){
  if(!running) return;

  if(playerLane<2){
    playerLane++;
    player.style.left=lanePositions[playerLane];
  }
}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
    moveLeft();
  }

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
    moveRight();
  }

  if(e.key===" " && !running){
    startGame();
  }
});

document.getElementById("leftBtn").addEventListener("pointerdown",moveLeft);
document.getElementById("rightBtn").addEventListener("pointerdown",moveRight);

document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("restartBtn").addEventListener("click",startGame);

createRoadLines();
trafficSpawner();
</script>

</body>
</html>
