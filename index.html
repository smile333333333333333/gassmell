<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Highway Rush</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#347338;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

#road{
  position:absolute;
  left:5%;
  width:90%;
  height:100%;
  overflow:hidden;
  background:#444;
  border-left:12px solid #aaa;
  border-right:12px solid #aaa;
}

/* ROAD */

.roadLine{
  position:absolute;
  width:7px;
  height:100px;
  background:white;
  opacity:.85;
}

.lineA{
  left:33.333%;
}

.lineB{
  left:66.666%;
}

/* PLAYER */

#player{
  position:absolute;
  width:52px;
  height:88px;
  left:50%;
  bottom:65px;
  transform:translateX(-50%);
  background:#176ed1;
  border-radius:10px;
  z-index:20;
  box-shadow:0 5px 12px rgba(0,0,0,.7);
}

#playerWindow{
  position:absolute;
  width:38px;
  height:27px;
  left:7px;
  top:10px;
  border-radius:6px;
  background:#9ed7e8;
}

#playerStripe{
  position:absolute;
  width:40px;
  height:5px;
  left:6px;
  top:42px;
  background:rgba(255,255,255,.35);
}

.wheel{
  position:absolute;
  width:10px;
  height:27px;
  background:#111;
  border-radius:4px;
  top:20px;
}

.wheel.left{
  left:-7px;
}

.wheel.right{
  right:-7px;
}

.light{
  position:absolute;
  width:10px;
  height:7px;
  bottom:5px;
  background:white;
  border-radius:2px;
}

.light.left{
  left:7px;
}

.light.right{
  right:7px;
}

/* TRAFFIC */

.car{
  position:absolute;
  width:48px;
  height:84px;
  transform:translateX(-50%);
  border-radius:9px;
  z-index:10;
  box-shadow:0 4px 8px rgba(0,0,0,.65);
}

.carWindow{
  position:absolute;
  width:34px;
  height:25px;
  left:7px;
  top:9px;
  background:#a7d7e5;
  border-radius:5px;
}

.carWheel{
  position:absolute;
  width:9px;
  height:25px;
  background:#111;
  border-radius:3px;
  top:19px;
}

.carWheel.left{
  left:-6px;
}

.carWheel.right{
  right:-6px;
}

/* SPEECH BUBBLES */

.bubble{
  position:absolute;
  left:50%;
  top:-8px;
  transform:translate(-50%,-100%);
  background:white;
  color:#111;
  padding:7px 11px;
  border-radius:13px;
  white-space:nowrap;
  font-size:13px;
  font-weight:bold;
  box-shadow:0 2px 7px rgba(0,0,0,.7);
  z-index:100;
  animation:bubblePop .15s ease-out;
}

.bubble:after{
  content:"";
  position:absolute;
  bottom:-7px;
  left:50%;
  transform:translateX(-50%);
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-top:8px solid white;
}

@keyframes bubblePop{
  from{
    transform:translate(-50%,-100%) scale(.5);
  }
  to{
    transform:translate(-50%,-100%) scale(1);
  }
}

/* HUD */

#hud{
  position:absolute;
  top:10px;
  left:10px;
  z-index:100;
  color:white;
  font-weight:bold;
  font-size:17px;
  line-height:1.5;
  text-shadow:2px 2px 4px black;
}

/* CONTROLS */

#controls{
  position:absolute;
  bottom:17px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:20px;
  z-index:100;
}

.control{
  width:85px;
  height:62px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  background:rgba(0,0,0,.55);
  border:2px solid white;
  border-radius:12px;
  font-size:32px;
  touch-action:none;
}

.control:active{
  background:rgba(255,255,255,.25);
}

/* SCREENS */

.screen{
  position:absolute;
  inset:0;
  z-index:200;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background:rgba(0,0,0,.82);
  padding:25px;
}

.screen h1{
  margin:0 0 10px;
  font-size:42px;
  letter-spacing:3px;
}

.screen p{
  max-width:500px;
  line-height:1.5;
}

button{
  border:0;
  border-radius:9px;
  padding:15px 34px;
  color:white;
  background:#1685ff;
  font-size:20px;
  font-weight:bold;
}

.hidden{
  display:none!important;
}

#crashFlash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
  z-index:150;
}

@media(max-width:600px){
  #road{
    left:3%;
    width:94%;
  }

  .screen h1{
    font-size:32px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="road"></div>

  <div id="player">
    <div id="playerWindow"></div>
    <div id="playerStripe"></div>

    <div class="wheel left"></div>
    <div class="wheel right"></div>

    <div class="light left"></div>
    <div class="light right"></div>
  </div>

  <div id="hud">
    DISTANCE:
    <span id="distance">0</span> m
    <br>

    SCORE:
    <span id="score">0</span>
    <br>

    SPEED:
    <span id="speed">120</span> km/h
  </div>

  <div id="controls">
    <div class="control" id="leftButton">◀</div>
    <div class="control" id="rightButton">▶</div>
  </div>

  <div id="crashFlash"></div>

  <div id="startScreen" class="screen">

    <h1>HIGHWAY RUSH</h1>

    <p>
      Drive down a normal highway,
      dodge traffic and pass other drivers.
      <br><br>
      They're not always happy when you pass them.
      <br><br>
      <b>Arrow Keys / A & D</b> or use the buttons.
    </p>

    <button id="startButton">
      START DRIVING
    </button>

  </div>

  <div id="gameOver" class="screen hidden">

    <h1>CRASH!</h1>

    <p>
      Distance:
      <b><span id="finalDistance">0</span> m</b>
      <br>

      Score:
      <b><span id="finalScore">0</span></b>
    </p>

    <button id="restartButton">
      DRIVE AGAIN
    </button>

  </div>

</div>

<script>

/* =========================================
   GAME SETUP
   ========================================= */

const road =
  document.getElementById("road");

const player =
  document.getElementById("player");

const distanceText =
  document.getElementById("distance");

const scoreText =
  document.getElementById("score");

const speedText =
  document.getElementById("speed");

const startScreen =
  document.getElementById("startScreen");

const gameOver =
  document.getElementById("gameOver");

const finalDistance =
  document.getElementById("finalDistance");

const finalScore =
  document.getElementById("finalScore");

const flash =
  document.getElementById("crashFlash");


let running = false;

let lastTime = 0;

let distance = 0;

let score = 0;

let speed = 12;


/*
  The player's actual horizontal position.
  This value NEVER moves toward zero
  when steering is released.
*/

let playerX = 0;


/*
  -1 = left
   0 = stopped steering
   1 = right
*/

let steering = 0;


let traffic = [];

let roadLines = [];

let spawnTimer = 0;


/* =========================================
   DRIVER REACTIONS
   ========================================= */

const reactions = [

  "HEY!",
  "WATCH IT!",
  "SLOW DOWN!",
  "MOVE!",
  "WHAT ARE YOU DOING?!",
  "HEY, WATCH IT!",
  "THAT WAS CLOSE!",
  "YOU CUT ME OFF!",
  "COME ON!",
  "SERIOUSLY?!",
  "GET OUT OF THE WAY!",
  "WATCH WHERE YOU'RE GOING!",
  "HEY!",
  "COME ON, MAN!"

];


/* =========================================
   CREATE ROAD
   ========================================= */

function createRoad(){

  for(let i=0;i<15;i++){

    const lineA =
      document.createElement("div");

    lineA.className =
      "roadLine lineA";

    lineA.style.top =
      (i * 115 - 120) + "px";

    road.appendChild(lineA);

    roadLines.push(lineA);


    const lineB =
      document.createElement("div");

    lineB.className =
      "roadLine lineB";

    lineB.style.top =
      (i * 115 - 120) + "px";

    road.appendChild(lineB);

    roadLines.push(lineB);

  }

}


/* =========================================
   MOVE ROAD
   ========================================= */

function moveRoad(delta){

  for(const line of roadLines){

    let y =
      parseFloat(line.style.top);

    y += speed * 0.95 * delta;

    if(
      y >
      window.innerHeight + 120
    ){

      y = -120;

    }

    line.style.top =
      y + "px";

  }

}


/* =========================================
   PLAYER STEERING
   ========================================= */

function updatePlayer(delta){

  /*
    FAST STEERING.

    The car moves while a direction is
    being held.
  */

  const steeringPower = 1.75;

  if(steering !== 0){

    playerX +=
      steering *
      steeringPower *
      delta;

  }


  /*
    IMPORTANT:
    There is NO code here that pulls
    playerX back toward 0.

    Releasing the button simply sets
    steering to 0, so the car stays
    exactly where it is.
  */


  const roadWidth =
    road.clientWidth;

  const maxX =
    roadWidth / 2 - 40;


  /*
    Road boundaries.
  */

  if(playerX > maxX){

    playerX = maxX;

  }

  if(playerX < -maxX){

    playerX = -maxX;

  }


  player.style.left =
    `calc(50% + ${playerX}px)`;

}


/* =========================================
   CREATE TRAFFIC
   ========================================= */

function createTraffic(){

  if(!running)return;


  const car =
    document.createElement("div");

  car.className =
    "car";


  const colors = [

    "#d93434",
    "#eeeeee",
    "#222222",
    "#e0b42d",
    "#29964f",
    "#7545c2",
    "#e87820",
    "#277cc9",
    "#999999"

  ];


  car.style.background =
    colors[
      Math.floor(
        Math.random() *
        colors.length
      )
    ];


  const margin = 40;


  const x =
    margin +
    Math.random() *
    (
      road.clientWidth -
      margin * 2
    );


  const y = -110;


  car.style.left =
    x + "px";

  car.style.top =
    y + "px";


  const windowDiv =
    document.createElement("div");

  windowDiv.className =
    "carWindow";

  car.appendChild(windowDiv);


  const wheel1 =
    document.createElement("div");

  wheel1.className =
    "carWheel left";

  car.appendChild(wheel1);


  const wheel2 =
    document.createElement("div");

  wheel2.className =
    "carWheel right";

  car.appendChild(wheel2);


  road.appendChild(car);


  traffic.push({

    element:car,

    x:x,

    y:y,

    passed:false

  });

}


/* =========================================
   DRIVER YELLS
   ========================================= */

function makeDriverYell(car){

  if(!car.element.parentNode){

    return;

  }


  /*
    A small chance the driver
    doesn't react.
  */

  if(Math.random() < 0.12){

    return;

  }


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  bubble.textContent =
    reactions[
      Math.floor(
        Math.random() *
        reactions.length
      )
    ];


  car.element.appendChild(
    bubble
  );


  /*
    Keep the bubble around
    for a few seconds.
  */

  setTimeout(()=>{

    if(bubble.parentNode){

      bubble.remove();

    }

  },2300);

}


/* =========================================
   MOVE TRAFFIC
   ========================================= */

function moveTraffic(delta){

  for(
    let i = traffic.length - 1;
    i >= 0;
    i--
  ){

    const car =
      traffic[i];


    car.y +=
      speed *
      0.88 *
      delta;


    car.element.style.top =
      car.y + "px";


    /*
      The player has passed this car.
    */

    if(
      !car.passed &&
      car.y >
      player.offsetTop +
      player.offsetHeight
    ){

      car.passed = true;

      score += 15;


      const playerCenter =
        road.clientWidth / 2 +
        playerX;


      const difference =
        Math.abs(
          playerCenter -
          car.x
        );


      /*
        Close pass = angry driver.
      */

      if(difference < 100){

        score += 25;

        makeDriverYell(car);

      }

    }


    /*
      Delete cars after they
      leave the screen.
    */

    if(
      car.y >
      window.innerHeight + 150
    ){

      car.element.remove();

      traffic.splice(i,1);

    }

  }

}


/* =========================================
   COLLISION
   ========================================= */

function isColliding(a,b){

  const A =
    a.getBoundingClientRect();

  const B =
    b.getBoundingClientRect();


  return !(
    A.right < B.left + 7 ||
    A.left > B.right - 7 ||
    A.bottom < B.top + 10 ||
    A.top > B.bottom - 10
  );

}


function checkCollision(){

  for(const car of traffic){

    if(
      isColliding(
        player,
        car.element
      )
    ){

      crash();

      return;

    }

  }

}


/* =========================================
   CRASH
   ========================================= */

function crash(){

  if(!running)return;

  running = false;


  flash.style.opacity =
    ".8";


  setTimeout(()=>{

    flash.style.opacity =
      "0";

  },150);


  finalDistance.textContent =
    Math.floor(distance);

  finalScore.textContent =
    Math.floor(score);


  gameOver.classList.remove(
    "hidden"
  );

}


/* =========================================
   GAME LOOP
   ========================================= */

function gameLoop(time){

  if(!running)return;


  if(!lastTime){

    lastTime = time;

  }


  let delta =
    (time - lastTime) /
    16.67;


  if(delta > 3){

    delta = 3;

  }


  lastTime = time;


  distance +=
    speed *
    delta *
    0.12;


  /*
    Slowly increase speed.
  */

  speed +=
    0.0035 *
    delta;


  updatePlayer(delta);

  moveRoad(delta);

  moveTraffic(delta);

  checkCollision();


  distanceText.textContent =
    Math.floor(distance);

  scoreText.textContent =
    Math.floor(score);

  speedText.textContent =
    Math.floor(speed * 10);


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================
   SPAWN TRAFFIC
   ========================================= */

function spawnTraffic(delta){

  if(!running)return;


  spawnTimer -= delta;


  if(spawnTimer <= 0){

    createTraffic();


    if(Math.random() < 0.28){

      setTimeout(()=>{

        if(running){

          createTraffic();

        }

      },180);

    }


    spawnTimer =
      Math.max(
        320,
        700 - speed * 15
      );

  }

}


let spawnLast = 0;


function spawnLoop(time){

  if(!spawnLast){

    spawnLast = time;

  }


  const delta =
    time - spawnLast;


  spawnLast = time;


  spawnTraffic(delta);


  requestAnimationFrame(
    spawnLoop
  );

}


/* =========================================
   KEYBOARD
   ========================================= */

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ){

      steering = -1;

    }


    if(
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ){

      steering = 1;

    }

  }
);


document.addEventListener(
  "keyup",
  function(e){

    if(
      e.key === "ArrowLeft" ||
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "a" ||
      e.key.toLowerCase() === "d"
    ){

      /*
        STOP steering.

        The car stays at its current
        position instead of moving
        back toward the middle.
      */

      steering = 0;

    }

  }
);


/* =========================================
   TOUCH
   ========================================= */

const leftButton =
  document.getElementById(
    "leftButton"
  );

const rightButton =
  document.getElementById(
    "rightButton"
  );


leftButton.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    steering = -1;

  }
);


leftButton.addEventListener(
  "pointerup",
  function(){

    steering = 0;

  }
);


leftButton.addEventListener(
  "pointercancel",
  function(){

    steering = 0;

  }
);


rightButton.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    steering = 1;

  }
);


rightButton.addEventListener(
  "pointerup",
  function(){

    steering = 0;

  }
);


rightButton.addEventListener(
  "pointercancel",
  function(){

    steering = 0;

  }
);


/* =========================================
   START
   ========================================= */

function startGame(){

  for(const car of traffic){

    if(car.element.parentNode){

      car.element.remove();

    }

  }


  traffic = [];

  distance = 0;

  score = 0;

  speed = 12;

  playerX = 0;

  steering = 0;


  player.style.left =
    "calc(50% + 0px)";


  startScreen.classList.add(
    "hidden"
  );


  gameOver.classList.add(
    "hidden"
  );


  running = true;

  lastTime = 0;

  spawnTimer = 100;


  requestAnimationFrame(
    gameLoop
  );

}


/* =========================================
   BUTTONS
   ========================================= */

document
  .getElementById("startButton")
  .addEventListener(
    "click",
    startGame
  );


document
  .getElementById("restartButton")
  .addEventListener(
    "click",
    startGame
  );


/* =========================================
   INITIALIZE
   ========================================= */

createRoad();

requestAnimationFrame(
  spawnLoop
);

</script>

</body>
</html>
