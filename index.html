<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GAS: THE TRUTH</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#080808;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}
#menu{
    position:fixed;
    inset:0;
    background:linear-gradient(#111,#050505);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
}
.menuBox{
    text-align:center;
    border:2px solid #e33;
    padding:35px;
    width:min(90%,500px);
    box-shadow:0 0 30px #400;
}
h1{
    font-size:45px;
    margin:0 0 10px;
    color:#e33;
}
button{
    background:#b22;
    color:white;
    border:0;
    padding:15px 35px;
    font-size:20px;
    cursor:pointer;
    margin-top:20px;
}
button:hover{background:#e44}

#game{
    display:none;
    position:fixed;
    inset:0;
}

canvas{
    display:block;
    background:#151515;
}

#hud{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    pointer-events:none;
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    font-size:18px;
    text-shadow:2px 2px #000;
}

#message{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:rgba(0,0,0,.75);
    padding:10px 20px;
    display:none;
}

#bossbar{
    position:fixed;
    top:45px;
    left:50%;
    transform:translateX(-50%);
    width:60%;
    height:20px;
    border:2px solid white;
    display:none;
}
#bosshealth{
    height:100%;
    background:#d22;
    width:100%;
}

#controls{
    position:fixed;
    bottom:10px;
    left:10px;
    color:#aaa;
    font-size:13px;
}
</style>
</head>

<body>

<div id="menu">
    <div class="menuBox">
        <h1>GAS: THE TRUTH</h1>
        <p>A top-down action game.</p>
        <p>Something is seriously wrong at the gas company.</p>
        <p>Fight your way through the facility and discover the truth.</p>
        <button id="startButton">START GAME</button>
    </div>
</div>

<div id="game">
    <canvas id="canvas"></canvas>

    <div id="hud">
        <div>HEALTH: <span id="health">100</span></div>
        <div>AMMO: <span id="ammo">30</span></div>
        <div>SCORE: <span id="score">0</span></div>
    </div>

    <div id="bossbar">
        <div id="bosshealth"></div>
    </div>

    <div id="message"></div>

    <div id="controls">
        WASD = Move &nbsp; | &nbsp; Mouse = Aim &nbsp; | &nbsp; Click = Shoot
    </div>
</div>

<script>
/* =========================
   GAME SETUP
========================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const gameScreen = document.getElementById("game");
const startButton = document.getElementById("startButton");

const healthText = document.getElementById("health");
const ammoText = document.getElementById("ammo");
const scoreText = document.getElementById("score");

const bossBar = document.getElementById("bossbar");
const bossHealth = document.getElementById("bosshealth");
const message = document.getElementById("message");

let W = window.innerWidth;
let H = window.innerHeight;

canvas.width = W;
canvas.height = H;

window.addEventListener("resize",()=>{
    W=window.innerWidth;
    H=window.innerHeight;
    canvas.width=W;
    canvas.height=H;
});

/* =========================
   GAME VARIABLES
========================= */

let running=false;
let gameOver=false;

let score=0;
let ammo=30;

let keys={};
let mouse={
    x:W/2,
    y:H/2,
    down:false
};

let player;

let enemies=[];
let bullets=[];
let enemyBullets=[];
let pickups=[];

let boss=null;

let spawnTimer=0;
let bossStarted=false;

/* =========================
   INPUT
========================= */

window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;
});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

canvas.addEventListener("mousemove",e=>{
    mouse.x=e.clientX;
    mouse.y=e.clientY;
});

canvas.addEventListener("mousedown",()=>{
    mouse.down=true;
});

window.addEventListener("mouseup",()=>{
    mouse.down=false;
});

/* =========================
   START GAME
========================= */

startButton.addEventListener("click",startGame);

function startGame(){

    menu.style.display="none";
    gameScreen.style.display="block";

    running=true;
    gameOver=false;

    score=0;
    ammo=30;

    enemies=[];
    bullets=[];
    enemyBullets=[];
    pickups=[];

    boss=null;
    bossStarted=false;

    player={
        x:W/2,
        y:H/2,
        radius:16,
        speed:4,
        health:100,
        fireCooldown:0,
        invincible:0
    };

    for(let i=0;i<6;i++){
        spawnEnemy();
    }

    showMessage("GET THROUGH THE FACILITY");

    requestAnimationFrame(loop);
}

/* =========================
   MESSAGE
========================= */

function showMessage(text){

    message.textContent=text;
    message.style.display="block";

    clearTimeout(showMessage.timer);

    showMessage.timer=setTimeout(()=>{
        message.style.display="none";
    },2500);
}

/* =========================
   SPAWN ENEMIES
========================= */

function spawnEnemy(){

    let side=Math.floor(Math.random()*4);

    let x,y;

    if(side===0){
        x=Math.random()*W;
        y=-30;
    }

    if(side===1){
        x=W+30;
        y=Math.random()*H;
    }

    if(side===2){
        x=Math.random()*W;
        y=H+30;
    }

    if(side===3){
        x=-30;
        y=Math.random()*H;
    }

    enemies.push({
        x:x,
        y:y,
        radius:17,
        speed:1.2+Math.random()*0.7,
        health:40,
        shootTimer:60+Math.random()*100
    });
}

/* =========================
   PICKUPS
========================= */

function spawnPickup(x,y){

    pickups.push({
        x:x,
        y:y,
        radius:11,
        type:Math.random()<.7 ? "ammo":"health"
    });
}

/* =========================
   SHOOT
========================= */

function shoot(){

    if(player.fireCooldown>0)return;

    if(ammo<=0){
        showMessage("OUT OF AMMO");
        player.fireCooldown=20;
        return;
    }

    let angle=Math.atan2(
        mouse.y-player.y,
        mouse.x-player.x
    );

    bullets.push({
        x:player.x,
        y:player.y,
        dx:Math.cos(angle)*9,
        dy:Math.sin(angle)*9,
        radius:4
    });

    ammo--;

    player.fireCooldown=10;
}

/* =========================
   ENEMY SHOOTING
========================= */

function enemyShoot(enemy){

    let angle=Math.atan2(
        player.y-enemy.y,
        player.x-enemy.x
    );

    enemyBullets.push({
        x:enemy.x,
        y:enemy.y,
        dx:Math.cos(angle)*4,
        dy:Math.sin(angle)*4,
        radius:5
    });
}

/* =========================
   BOSS
========================= */

function startBoss(){

    bossStarted=true;

    boss={
        x:W/2,
        y:120,
        radius:40,
        health:500,
        maxHealth:500,
        speed:1.4,
        shootTimer:60
    };

    bossBar.style.display="block";

    showMessage("WARNING: FACILITY SECURITY BOSS");
}

/* =========================
   UPDATE
========================= */

function update(){

    if(!running)return;

    /* PLAYER MOVEMENT */

    let dx=0;
    let dy=0;

    if(keys["w"])dy--;
    if(keys["s"])dy++;
    if(keys["a"])dx--;
    if(keys["d"])dx++;

    if(dx!==0 || dy!==0){

        let length=Math.hypot(dx,dy);

        dx/=length;
        dy/=length;

        player.x+=dx*player.speed;
        player.y+=dy*player.speed;
    }

    player.x=Math.max(20,Math.min(W-20,player.x));
    player.y=Math.max(20,Math.min(H-20,player.y));

    if(player.fireCooldown>0)
        player.fireCooldown--;

    if(player.invincible>0)
        player.invincible--;

    if(mouse.down)
        shoot();

    /* BULLETS */

    for(let i=bullets.length-1;i>=0;i--){

        let b=bullets[i];

        b.x+=b.dx;
        b.y+=b.dy;

        if(
            b.x<0 ||
            b.x>W ||
            b.y<0 ||
            b.y>H
        ){
            bullets.splice(i,1);
            continue;
        }

        /* HIT ENEMIES */

        for(let j=enemies.length-1;j>=0;j--){

            let e=enemies[j];

            if(distance(b,e)<b.radius+e.radius){

                e.health-=20;
                bullets.splice(i,1);

                if(e.health<=0){

                    score+=100;

                    if(Math.random()<.5)
                        spawnPickup(e.x,e.y);

                    enemies.splice(j,1);
                }

                break;
            }
        }

        /* HIT BOSS */

        if(boss && distance(b,boss)<b.radius+boss.radius){

            boss.health-=10;

            bullets.splice(i,1);

            if(boss.health<=0){

                boss=null;
                bossBar.style.display="none";

                score+=5000;

                showMessage("BOSS DEFEATED — YOU FOUND THE TRUTH");

                setTimeout(()=>{
                    winGame();
                },1800);
            }
        }
    }

    /* ENEMIES */

    for(let i=enemies.length-1;i>=0;i--){

        let e=enemies[i];

        let angle=Math.atan2(
            player.y-e.y,
            player.x-e.x
        );

        e.x+=Math.cos(angle)*e.speed;
        e.y+=Math.sin(angle)*e.speed;

        e.shootTimer--;

        if(e.shootTimer<=0){

            enemyShoot(e);

            e.shootTimer=90+Math.random()*90;
        }

        if(distance(e,player)<e.radius+player.radius){

            damagePlayer(10);

            e.x-=Math.cos(angle)*25;
            e.y-=Math.sin(angle)*25;
        }
    }

    /* ENEMY BULLETS */

    for(let i=enemyBullets.length-1;i>=0;i--){

        let b=enemyBullets[i];

        b.x+=b.dx;
        b.y+=b.dy;

        if(
            b.x<0 ||
            b.x>W ||
            b.y<0 ||
            b.y>H
        ){
            enemyBullets.splice(i,1);
            continue;
        }

        if(distance(b,player)<b.radius+player.radius){

            enemyBullets.splice(i,1);

            damagePlayer(8);
        }
    }

    /* PICKUPS */

    for(let i=pickups.length-1;i>=0;i--){

        let p=pickups[i];

        if(distance(p,player)<p.radius+player.radius){

            if(p.type==="ammo"){

                ammo+=15;

                showMessage("+15 AMMO");
            }
            else{

                player.health=Math.min(
                    100,
                    player.health+25
                );

                showMessage("+25 HEALTH");
            }

            pickups.splice(i,1);
        }
    }

    /* SPAWNING */

    if(!bossStarted){

        spawnTimer--;

        if(spawnTimer<=0){

            if(enemies.length<10)
                spawnEnemy();

            spawnTimer=80;
        }

        if(score>=1000 && enemies.length===0){

            startBoss();
        }
    }

    /* BOSS */

    if(boss){

        let angle=Math.atan2(
            player.y-boss.y,
            player.x-boss.x
        );

        boss.x+=Math.cos(angle)*boss.speed;
        boss.y+=Math.sin(angle)*boss.speed;

        boss.shootTimer--;

        if(boss.shootTimer<=0){

            for(let k=0;k<5;k++){

                let spread=(k-2)*0.18;

                let a=angle+spread;

                enemyBullets.push({
                    x:boss.x,
                    y:boss.y,
                    dx:Math.cos(a)*4.5,
                    dy:Math.sin(a)*4.5,
                    radius:6
                });
            }

            boss.shootTimer=65;
        }

        if(distance(boss,player)<boss.radius+player.radius){

            damagePlayer(15);
        }

        bossHealth.style.width=
            Math.max(
                0,
                boss.health/boss.maxHealth*100
            )+"%";
    }

    /* HUD */

    healthText.textContent=Math.max(0,player.health);
    ammoText.textContent=ammo;
    scoreText.textContent=score;
}

/* =========================
   DAMAGE
========================= */

function damagePlayer(amount){

    if(player.invincible>0)return;

    player.health-=amount;

    player.invincible=30;

    if(player.health<=0){

        player.health=0;

        loseGame();
    }
}

/* =========================
   DISTANCE
========================= */

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}

/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(0,0,W,H);

    /* FLOOR */

    ctx.fillStyle="#171717";
    ctx.fillRect(0,0,W,H);

    /* FLOOR GRID */

    ctx.strokeStyle="#222";
    ctx.lineWidth=1;

    for(let x=0;x<W;x+=50){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    for(let y=0;y<H;y+=50){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }

    /* WALLS / FACILITY DETAILS */

    ctx.fillStyle="#292929";

    ctx.fillRect(50,80,200,25);
    ctx.fillRect(W-250,80,200,25);

    ctx.fillRect(50,H-105,200,25);
    ctx.fillRect(W-250,H-105,200,25);

    /* PICKUPS */

    for(let p of pickups){

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);

        ctx.fillStyle=
            p.type==="ammo" ? "#ddd":"#5d5";

        ctx.fill();

        ctx.fillStyle="#111";
        ctx.font="12px Arial";
        ctx.textAlign="center";
        ctx.fillText(
            p.type==="ammo" ? "A":"+",
            p.x,
            p.y+4
        );
    }

    /* ENEMIES */

    for(let e of enemies){

        ctx.beginPath();
        ctx.arc(
            e.x,
            e.y,
            e.radius,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#b33";
        ctx.fill();

        /* health */

        ctx.fillStyle="#222";
        ctx.fillRect(
            e.x-18,
            e.y-27,
            36,
            5
        );

        ctx.fillStyle="#5d5";
        ctx.fillRect(
            e.x-18,
            e.y-27,
            36*(e.health/40),
            5
        );
    }

    /* BOSS */

    if(boss){

        ctx.beginPath();
        ctx.arc(
            boss.x,
            boss.y,
            boss.radius,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#722";
        ctx.fill();

        ctx.strokeStyle="#f55";
        ctx.lineWidth=4;
        ctx.stroke();

        ctx.fillStyle="white";
        ctx.font="bold 15px Arial";
        ctx.textAlign="center";
        ctx.fillText(
            "BOSS",
            boss.x,
            boss.y+5
        );
    }

    /* PLAYER */

    ctx.save();

    if(player.invincible>0)
        ctx.globalAlpha=.5;

    ctx.beginPath();
    ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#4aa3ff";
    ctx.fill();

    /* AIM LINE */

    let angle=Math.atan2(
        mouse.y-player.y,
        mouse.x-player.x
    );

    ctx.strokeStyle="#ddd";
    ctx.lineWidth=5;

    ctx.beginPath();
    ctx.moveTo(player.x,player.y);

    ctx.lineTo(
        player.x+Math.cos(angle)*27,
        player.y+Math.sin(angle)*27
    );

    ctx.stroke();

    ctx.restore();

    /* BULLETS */

    ctx.fillStyle="#fff";

    for(let b of bullets){

        ctx.beginPath();
        ctx.arc(
            b.x,
            b.y,
            b.radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    /* ENEMY BULLETS */

    ctx.fillStyle="#f55";

    for(let b of enemyBullets){

        ctx.beginPath();
        ctx.arc(
            b.x,
            b.y,
            b.radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }
}

/* =========================
   GAME LOOP
========================= */

function loop(){

    if(!running)return;

    update();
    draw();

    requestAnimationFrame(loop);
}

/* =========================
   GAME OVER
========================= */

function loseGame(){

    running=false;

    setTimeout(()=>{

        alert(
            "GAME OVER\n\nScore: "+score
        );

        location.reload();

    },100);
}

/* =========================
   WIN
========================= */

function winGame(){

    running=false;

    setTimeout(()=>{

        alert(
            "YOU WON!\n\n"+
            "You made it through the facility.\n"+
            "Score: "+score
        );

        location.reload();

    },100);
}
</script>

</body>
  </html>
