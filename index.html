<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>GAS: THE ESCAPE</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#game{
    display:block;
    width:100vw;
    height:100vh;
    background:#222;
}

#menu{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#111;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

#menu h1{
    margin:0;
    color:#ffcc00;
    font-size:clamp(60px,15vw,110px);
    text-shadow:0 0 20px #aa8800;
}

#menu p{
    color:#aaa;
    margin:5px 0 30px;
    font-size:18px;
}

button{
    padding:20px 50px;
    font-size:28px;
    font-weight:bold;
    color:#ffcc00;
    background:#222;
    border:3px solid #ffcc00;
    border-radius:10px;
}

button:active{
    transform:scale(.96);
}

#hud{
    display:none;
    position:fixed;
    top:8px;
    left:8px;
    z-index:100;
    color:white;
    font-size:17px;
    font-weight:bold;
    text-shadow:2px 2px #000;
}

.box{
    display:inline-block;
    background:rgba(0,0,0,.75);
    border:2px solid #555;
    border-radius:5px;
    padding:6px 9px;
    margin:2px;
}

#healthBar{
    display:inline-block;
    width:130px;
    height:15px;
    border:2px solid white;
    background:#222;
    vertical-align:middle;
}

#healthFill{
    display:block;
    width:100%;
    height:100%;
    background:#35d45a;
}

#bossBar{
    display:none;
    position:fixed;
    top:75px;
    left:50%;
    transform:translateX(-50%);
    width:min(600px,80vw);
    height:24px;
    background:#222;
    border:3px solid #e33;
    z-index:120;
}

#bossFill{
    width:100%;
    height:100%;
    background:#d22;
}

#message{
    position:fixed;
    top:38%;
    left:0;
    width:100%;
    text-align:center;
    color:white;
    font-size:clamp(35px,8vw,70px);
    font-weight:bold;
    text-shadow:4px 4px #000;
    pointer-events:none;
    z-index:150;
}

#gameOver{
    display:none;
    position:fixed;
    inset:0;
    z-index:10000;
    background:rgba(0,0,0,.92);
    color:white;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

#gameOver h1{
    color:#e33;
    font-size:65px;
    margin:0 0 15px;
}

#finalScore{
    font-size:23px;
    margin-bottom:30px;
}

#mobile{
    display:none;
    position:fixed;
    inset:0;
    z-index:500;
    pointer-events:none;
}

.mobileButton{
    position:absolute;
    width:64px;
    height:64px;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    border:2px solid rgba(255,255,255,.45);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    pointer-events:auto;
    touch-action:none;
    font-weight:bold;
}

#up{
    left:80px;
    bottom:145px;
}

#down{
    left:80px;
    bottom:20px;
}

#left{
    left:10px;
    bottom:82px;
}

#right{
    left:150px;
    bottom:82px;
}

#fire{
    right:25px;
    bottom:30px;
    width:95px;
    height:95px;
    background:rgba(220,40,40,.35);
}

#reload{
    right:145px;
    bottom:35px;
    font-size:11px;
}

@media(pointer:coarse){
    #mobile{
        display:block;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
    <h1>GAS</h1>
    <p>THE ESCAPE</p>

    <!-- DO NOT CHANGE THIS -->
    <button onclick="startGame()">START GAME</button>
</div>

<div id="hud">

    <span class="box">
        HP
        <span id="healthBar">
            <span id="healthFill"></span>
        </span>
    </span>

    <span class="box">
        AMMO:
        <span id="ammo">12</span>
        /
        <span id="reserve">120</span>
    </span>

    <span class="box">
        WAVE:
        <span id="wave">1</span>
    </span>

    <span class="box">
        SCORE:
        <span id="score">0</span>
    </span>

</div>

<div id="bossBar">
    <div id="bossFill"></div>
</div>

<div id="message"></div>

<div id="gameOver">

    <h1>GAME OVER</h1>

    <div id="finalScore">
        Score: 0
    </div>

    <button onclick="startGame()">
        PLAY AGAIN
    </button>

</div>

<div id="mobile">

    <div class="mobileButton" id="up">▲</div>
    <div class="mobileButton" id="down">▼</div>
    <div class="mobileButton" id="left">◀</div>
    <div class="mobileButton" id="right">▶</div>

    <div class="mobileButton" id="fire">
        FIRE
    </div>

    <div class="mobileButton" id="reload">
        RELOAD
    </div>

</div>

<script>

/* =========================================================
   CORE
========================================================= */

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");

var W = 0;
var H = 0;

var playing = false;
var score = 0;
var wave = 1;
var lastTime = 0;

var cameraX = 0;
var cameraY = 0;

var messageTimer = 0;

var WORLD_WIDTH = 3200;
var WORLD_HEIGHT = 2400;

var enemies = [];
var bullets = [];
var particles = [];
var pickups = [];
var walls = [];

var enemiesToSpawn = 0;
var spawnTimer = 0;

var boss = null;


/* =========================================================
   PLAYER
========================================================= */

var player = {

    x: WORLD_WIDTH / 2,
    y: WORLD_HEIGHT / 2,

    radius: 20,

    speed: 280,

    health: 100,
    maxHealth: 100,

    ammo: 12,
    maxAmmo: 12,

    reserve: 120,

    shootTimer: 0,
    reloadTimer: 0,
    invincible: 0

};


/* =========================================================
   INPUT
========================================================= */

var keys = {};

var mouseX = 0;
var mouseY = 0;
var mouseDown = false;

var mobile = {
    up:false,
    down:false,
    left:false,
    right:false,
    fire:false
};


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    W = canvas.width;
    H = canvas.height;
}

resize();

window.addEventListener("resize",resize);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener("keydown",function(e){

    keys[e.key.toLowerCase()] = true;

    if(e.key.toLowerCase() === "r"){
        reload();
    }

});

document.addEventListener("keyup",function(e){

    keys[e.key.toLowerCase()] = false;

});


/* =========================================================
   MOUSE
========================================================= */

canvas.addEventListener("mousemove",function(e){

    mouseX = e.clientX;
    mouseY = e.clientY;

});

canvas.addEventListener("mousedown",function(e){

    if(e.button === 0){
        mouseDown = true;
    }

});

document.addEventListener("mouseup",function(e){

    if(e.button === 0){
        mouseDown = false;
    }

});


/* =========================================================
   MOBILE CONTROLS
========================================================= */

function holdButton(id,name){

    var button = document.getElementById(id);

    button.addEventListener("touchstart",function(e){
        e.preventDefault();
        mobile[name] = true;
    },{passive:false});

    button.addEventListener("touchend",function(e){
        e.preventDefault();
        mobile[name] = false;
    },{passive:false});

    button.addEventListener("touchcancel",function(e){
        e.preventDefault();
        mobile[name] = false;
    },{passive:false});

    button.addEventListener("mousedown",function(){
        mobile[name] = true;
    });

    button.addEventListener("mouseup",function(){
        mobile[name] = false;
    });

    button.addEventListener("mouseleave",function(){
        mobile[name] = false;
    });
}

holdButton("up","up");
holdButton("down","down");
holdButton("left","left");
holdButton("right","right");
holdButton("fire","fire");

document.getElementById("reload").addEventListener(
    "click",
    reload
);


/* =========================================================
   UTILITY
========================================================= */

function random(min,max){
    return Math.random() * (max-min) + min;
}

function randomInt(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

function clamp(value,min,max){
    return Math.max(min,Math.min(max,value));
}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    playing = true;

    score = 0;
    wave = 1;

    enemies = [];
    bullets = [];
    particles = [];
    pickups = [];
    walls = [];

    boss = null;

    player.x = WORLD_WIDTH/2;
    player.y = WORLD_HEIGHT/2;

    player.health = 100;
    player.ammo = 12;
    player.reserve = 120;

    player.shootTimer = 0;
    player.reloadTimer = 0;
    player.invincible = 0;

    createWalls();

    document.getElementById("menu").style.display = "none";

    document.getElementById("gameOver").style.display = "none";

    document.getElementById("hud").style.display = "block";

    document.getElementById("bossBar").style.display = "none";

    showMessage("WAVE 1");

    startWave();

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}


/* =========================================================
   WALLS
========================================================= */

function createWalls(){

    walls = [];

    for(var i=0;i<55;i++){

        var wall = {

            x:randomInt(100,WORLD_WIDTH-300),

            y:randomInt(100,WORLD_HEIGHT-250),

            width:randomInt(90,250),

            height:randomInt(60,190)

        };

        if(
            Math.abs(wall.x-player.x)<400 &&
            Math.abs(wall.y-player.y)<400
        ){
            continue;
        }

        walls.push(wall);
    }
}


/* =========================================================
   COLLISION
========================================================= */

function circleWallCollision(x,y,radius,wall){

    var closestX = clamp(
        x,
        wall.x,
        wall.x+wall.width
    );

    var closestY = clamp(
        y,
        wall.y,
        wall.y+wall.height
    );

    var dx = x-closestX;
    var dy = y-closestY;

    return dx*dx+dy*dy < radius*radius;
}

function blocked(x,y,radius){

    if(
        x-radius<0 ||
        y-radius<0 ||
        x+radius>WORLD_WIDTH ||
        y+radius>WORLD_HEIGHT
    ){
        return true;
    }

    for(var i=0;i<walls.length;i++){

        if(
            circleWallCollision(
                x,
                y,
                radius,
                walls[i]
            )
        ){
            return true;
        }
    }

    return false;
}

function moveObject(object,dx,dy){

    if(!blocked(
        object.x+dx,
        object.y,
        object.radius
    )){
        object.x += dx;
    }

    if(!blocked(
        object.x,
        object.y+dy,
        object.radius
    )){
        object.y += dy;
    }
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    document.getElementById("message").textContent = text;

    messageTimer = 2;
}


/* =========================================================
   WAVES
========================================================= */

function startWave(){

    enemiesToSpawn = 5 + wave*3;

    spawnTimer = 0;

    showMessage("WAVE "+wave);
}


/* =========================================================
   SPAWN ENEMIES
========================================================= */

function spawnEnemy(){

    var side = randomInt(0,3);

    var x;
    var y;

    if(side===0){

        x=30;
        y=random(30,WORLD_HEIGHT-30);

    }else if(side===1){

        x=WORLD_WIDTH-30;
        y=random(30,WORLD_HEIGHT-30);

    }else if(side===2){

        x=random(30,WORLD_WIDTH-30);
        y=30;

    }else{

        x=random(30,WORLD_WIDTH-30);
        y=WORLD_HEIGHT-30;

    }

    var chance = Math.random();

    var enemy;

    if(chance<0.2 && wave>=3){

        enemy={

            type:"fast",

            x:x,
            y:y,

            radius:15,

            speed:190,

            health:45+wave*4,

            maxHealth:45+wave*4,

            damage:12,

            attack:0,

            color:"#ff8c00"

        };

    }else if(chance<0.4 && wave>=2){

        enemy={

            type:"tank",

            x:x,
            y:y,

            radius:29,

            speed:65,

            health:160+wave*12,

            maxHealth:160+wave*12,

            damage:20,

            attack:0,

            color:"#a24cff"

        };

    }else{

        enemy={

            type:"normal",

            x:x,
            y:y,

            radius:19,

            speed:95,

            health:60+wave*5,

            maxHealth:60+wave*5,

            damage:10,

            attack:0,

            shoot:random(.5,2),

            color:"#e54848"

        };

    }

    enemies.push(enemy);

    enemiesToSpawn--;
}


/* =========================================================
   BOSS
========================================================= */

function spawnBoss(){

    boss={

        x:WORLD_WIDTH/2,
        y:150,

        radius:70,

        speed:70,

        health:1200+wave*120,

        maxHealth:1200+wave*120,

        attack:0,

        shoot:1

    };

    document.getElementById(
        "bossBar"
    ).style.display="block";

    showMessage("THE GAS DIRECTOR");
}


/* =========================================================
   SHOOTING
========================================================= */

function shoot(){

    if(!playing){
        return;
    }

    if(player.reloadTimer>0){
        return;
    }

    if(player.shootTimer>0){
        return;
    }

    if(player.ammo<=0){

        reload();

        return;
    }

    var targetX = mouseX+cameraX;
    var targetY = mouseY+cameraY;

    var dx = targetX-player.x;
    var dy = targetY-player.y;

    var distance = Math.hypot(dx,dy);

    if(distance===0){
        distance=1;
    }

    dx/=distance;
    dy/=distance;

    bullets.push({

        x:player.x+dx*28,
        y:player.y+dy*28,

        vx:dx*900,
        vy:dy*900,

        radius:5,

        damage:35,

        life:2,

        friendly:true

    });

    player.ammo--;

    player.shootTimer=.12;
}


/* =========================================================
   RELOAD
========================================================= */

function reload(){

    if(!playing){
        return;
    }

    if(player.reloadTimer>0){
        return;
    }

    if(player.ammo>=player.maxAmmo){
        return;
    }

    if(player.reserve<=0){
        return;
    }

    player.reloadTimer=1;
}


/* =========================================================
   PARTICLES
========================================================= */

function particle(x,y,color){

    particles.push({

        x:x,
        y:y,

        vx:random(-200,200),
        vy:random(-200,200),

        size:random(2,6),

        life:.5,
        maxLife:.5,

        color:color

    });
}

function explosion(x,y,amount){

    for(var i=0;i<amount;i++){

        var angle=random(0,Math.PI*2);
        var speed=random(50,450);

        particles.push({

            x:x,
            y:y,

            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,

            size:random(2,9),

            life:random(.3,.9),
            maxLife:.9,

            color:
                Math.random()<.5
                ?"orange"
                :"yellow"

        });
    }
}


/* =========================================================
   PLAYER DAMAGE
========================================================= */

function damagePlayer(amount){

    if(player.invincible>0){
        return;
    }

    player.health-=amount;

    player.invincible=.35;

    for(var i=0;i<10;i++){

        particle(
            player.x,
            player.y,
            "red"
        );

    }

    if(player.health<=0){

        endGame();
    }
}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    var dx=0;
    var dy=0;

    if(
        keys["w"] ||
        keys["arrowup"] ||
        mobile.up
    ){
        dy--;
    }

    if(
        keys["s"] ||
        keys["arrowdown"] ||
        mobile.down
    ){
        dy++;
    }

    if(
        keys["a"] ||
        keys["arrowleft"] ||
        mobile.left
    ){
        dx--;
    }

    if(
        keys["d"] ||
        keys["arrowright"] ||
        mobile.right
    ){
        dx++;
    }

    if(dx!==0 || dy!==0){

        var distance=Math.hypot(dx,dy);

        dx/=distance;
        dy/=distance;

        moveObject(
            player,
            dx*player.speed*dt,
            dy*player.speed*dt
        );
    }

    if(mouseDown || mobile.fire){
        shoot();
    }

    if(player.shootTimer>0){
        player.shootTimer-=dt;
    }

    if(player.reloadTimer>0){

        player.reloadTimer-=dt;

        if(player.reloadTimer<=0){

            var needed =
                player.maxAmmo-player.ammo;

            var amount =
                Math.min(
                    needed,
                    player.reserve
                );

            player.ammo+=amount;
            player.reserve-=amount;
        }
    }

    if(player.invincible>0){
        player.invincible-=dt;
    }

    cameraX=player.x-W/2;
    cameraY=player.y-H/2;

    cameraX=clamp(
        cameraX,
        0,
        Math.max(0,WORLD_WIDTH-W)
    );

    cameraY=clamp(
        cameraY,
        0,
        Math.max(0,WORLD_HEIGHT-H)
    );
}


/* =========================================================
   BULLETS
========================================================= */

function updateBullets(dt){

    for(
        var i=bullets.length-1;
        i>=0;
        i--
    ){

        var b=bullets[i];

        b.x+=b.vx*dt;
        b.y+=b.vy*dt;

        b.life-=dt;

        var remove=b.life<=0;

        if(
            b.x<0 ||
            b.y<0 ||
            b.x>WORLD_WIDTH ||
            b.y>WORLD_HEIGHT
        ){
            remove=true;
        }

        for(var w=0;w<walls.length;w++){

            if(
                circleWallCollision(
                    b.x,
                    b.y,
                    b.radius,
                    walls[w]
                )
            ){

                remove=true;
                break;
            }
        }

        if(b.friendly){

            for(
                var j=enemies.length-1;
                j>=0;
                j--
            ){

                var e=enemies[j];

                var d=Math.hypot(
                    b.x-e.x,
                    b.y-e.y
                );

                if(
                    d<
                    b.radius+e.radius
                ){

                    e.health-=b.damage;

                    particle(
                        b.x,
                        b.y,
                        "white"
                    );

                    remove=true;

                    if(e.health<=0){

                        score+=
                            e.type==="tank"
                            ?50
                            :20;

                        explosion(
                            e.x,
                            e.y,
                            20
                        );

                        if(Math.
