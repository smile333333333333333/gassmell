<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>HIGHWAY RUSH 2</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#39733a;
}

#road{
  position:absolute;
  left:8%;
  width:84%;
  height:100%;
  background:#454545;
  border-left:12px solid #aaa;
  border-right:12px solid #aaa;
  overflow:hidden;
}

/* Road markings */
.line{
  position:absolute;
  width:7px;
  height:90px;
  background:white;
  opacity:.85;
}

.line1{left:33.333%}
.line2{left:66.666%}

/* Player */
#player{
  position:absolute;
  width:52px;
  height:88px;
  left:50%;
  bottom:55px;
  transform:translateX(-50%);
  background:#1675dc;
  border-radius:10px;
  z-index:20;
  box-shadow:0 5px 10px rgba(0,0,0,.7);
}

#playerWindow{
  position:absolute;
  width:38px;
  height:27px;
  left:7px;
  top:10px;
  background:#9ed9eb;
  border-radius:6px;
}

#playerRoof{
  position:absolute;
  width:42px;
  height:4px;
  left:5px;
  top:40px;
  background:#0b4d9a;
}

.wheel{
  position:absolute;
  width:10px;
  height:28px;
  background:#111;
  border-radius:4px;
  top:18px;
}

.wheel.left{left:-7px}
.wheel.right{right:-7px}

.light{
  position:absolute;
  width:10px;
  height:7px;
  bottom:5px;
  background:#fff;
  border-radius:2px;
}

.light.left{left:7px}
.light.right{right:7px}

/* Traffic */
.car{
  position:absolute;
  width:48px;
  height:84px;
  transform:translateX(-50%);
  border-radius:9px;
  z-index:10;
  box-shadow:0 4px 8px rgba(0,0,0,.65);
}

.car.truck{
  width:64px;
  height:120px;
  border-radius:6px;
}

.car .window{
  position:absolute;
  width:34px;
  height:25px;
  left:7px;
  top:9px;
  background:#a9d8e5;
  border-radius:5px;
}

.car.truck .window{
  width:44px;
  height:30px;
  left:10px;
}

.car .wheel{
  position:absolute;
  width:9px;
  height:25px;
  background:#111;
  top:18px;
  border-radius:3px;
}

.car .wheel.left{left:-6px}
.car .wheel.right{right:-6px}

.bubble{
  position:absolute;
  left:50%;
  top:-8px;
  transform:translate(-50%,-100%);
  background:white;
  color:#111;
  padding:7px 10px;
  border-radius:12px;
  white-space:nowrap;
  font-weight:bold;
  font-size:13px;
  box-shadow:0 2px 7px rgba(0,0,0,.6);
  z-index:50;
  animation:pop .15s ease-out;
}

.bubble:after{
  content:"";
  position:absolute;
  bottom:-7px;
  left:50%;
  transform:translateX(-50%);
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-top:8px solid white;
}

@keyframes pop{
  from{
    transform:translate(-50%,-100%) scale(.5);
  }
  to{
    transform:translate(-50%,-100%) scale(1);
  }
}

/* HUD */
#hud{
  position:absolute;
  top:12px;
  left:12px;
  z-index:80;
  color:white;
  font-weight:bold;
  font-size:17px;
  line-height:1.5;
  text-shadow:2px 2px 4px black;
}

#speedBar{
  margin-top:5px;
  width:170px;
  height:9px;
  background:#222;
  border:1px solid white;
  border-radius:6px;
  overflow:hidden;
}

#speedFill{
  height:100%;
  width:60%;
  background:white;
}

/* Steering buttons */
#controls{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:20px;
  z-index:90;
}

.control{
  width:82px;
  height:62px;
  border:2px solid white;
  border-radius:12px;
  background:rgba(0,0,0,.55);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  touch-action:none;
}

.control:active{
  background:rgba(255,255,255,.25);
}

/* Screens */
.screen{
  position:absolute;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.8);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  text-align:center;
  padding:25px;
}

.screen h1{
  font-size:43px;
  margin:0 0 10px;
  letter-spacing:3px;
}

.screen p{
  max-width:520px;
  line-height:1.5;
}

button{
  border:0;
  padding:15px 35px;
  font-size:20px;
  font-weight:bold;
  border-radius:9px;
  background:#1685ff;
  color:white;
}

.hidden{
  display:none!important;
}

#crashFlash{
  position:absolute;
  inset:0;
  z-index:150;
  background:white;
  opacity:0;
  pointer-events:none;
}

/* Mobile */
@media(max-width:600px){
  #road{
    left:3%;
    width:94%;
  }

  .screen h1{
    font-size:32px;
  }

  #hud{
    font-size:15px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="road"></div>

  <div id="player">
    <div id="playerWindow"></div>
    <div id="playerRoof"></div>

    <div class="wheel left"></div>
    <div class="wheel right"></div>

    <div class="light left"></div>
    <div class="light right"></div>
  </div>

  <div id="hud">
    DISTANCE: <span id="distance">0</span> m<br>
    SCORE: <span id="score">0</span><br>
    SPEED: <span id="speed">120</span> km/h

    <div id="speedBar">
      <div id="speedFill"></div>
    </div>
  </div>

  <div id="controls">
    <div class="control" id="left">◀</div>
    <div class="control" id="right">▶</div>
  </div>

  <div id="crashFlash"></div>

  <div id="start" class="screen">
    <h1>HIGHWAY RUSH</h1>

    <p>
      This isn't a racetrack.<br>
      It's a highway.
      <br><br>
      Steer smoothly around traffic,
      squeeze between cars,
      and see how far you can get.
      <br><br>
      Some drivers may have something to say about your driving.
    </p>

    <button id="startButton">START DRIVING</button>
  </div>

  <div id="gameOver" class="screen hidden">
    <h1>CRASH!</h1>

    <p>
      Distance: <b><span id="finalDistance">0</span> m</b>
      <br>
      Score: <b><span id="finalScore">0</span></b>
    </p>

    <button id="restartButton">DRIVE AGAIN</button>
  </div>

</div>

<script>
/* =========================
   HIGHWAY RUSH
   ========================= */

const game = document.getElementById("game");
const road = document.getElementById("road");
const player = document.getElementById("player");

const distanceText = document.getElementById("distance");
const scoreText = document.getElementById("score");
const speedText = document.getElementById("speed");
const speedFill = document.getElementById("speedFill");

const startScreen = document.getElementById("start");
const gameOverScreen = document.getElementById("gameOver");

const finalDistance = document.getElementById("finalDistance");
const finalScore = document.getElementById("finalScore");

const flash = document.getElementById("crashFlash");

let running = false;

let lastTime = 0;

let distance = 0;
let score = 0;

/* Starting speed is already pretty fast */
let speed = 12;

/* Smooth player movement */
let playerX = 0;
let steering = 0;

let traffic = [];
let roadLines = [];

let spawnTimer = 0;

const colors = [
  "#d83232",
  "#eeeeee",
  "#222222",
  "#e3b52c",
  "#2d9d55",
  "#8144c7",
  "#ec7621",
  "#1976c9",
  "#aaa"
];

const reactions = [
  "HEY!",
  "WATCH IT!",
  "WHAT ARE YOU DOING?!",
  "SLOW DOWN!",
  "MOVE!",
  "COME ON!",
  "HEY, WATCH IT!",
  "THAT WAS CLOSE!",
  "YOU CUT ME OFF!",
  "HEY!",
  "GET OUT OF THE WAY!",
  "SERIOUSLY?!"
];

/* =========================
   ROAD
   ========================= */

function createRoadLines(){

  for(let i=0;i<14;i++){

    for(let side=0;side<2;side++){

      const line=document.createElement("div");

      line.className=
        side===0
        ? "line line1"
        : "line line2";

      line.style.top=
        (i*115-120)+"px";

      road.appendChild(line);

      roadLines.push(line);
    }
  }
}

/* =========================
   PLAYER
   ========================= */

function updatePlayer(delta){

  /*
    Steering is acceleration based.

    Holding a direction makes the car
    gradually move faster in that direction.
  */

  if(steering!==0){

    playerX += steering * 0.42 * delta;

  }

  /*
    Friction.
  */

  if(steering===0){

    /*
      Don't completely stop steering instantly.
      This gives it a tiny bit of smoothness.
    */

    playerX *= 0.995;
  }

  /*
    Keep player on the highway.
  */

  const roadWidth=road.clientWidth;

  const maxX=
    roadWidth/2 - 40;

  if(playerX>maxX){
    playerX=maxX;
  }

  if(playerX<-maxX){
    playerX=-maxX;
  }

  player.style.left=
    `calc(50% + ${playerX}px)`;
}

/* =========================
   ROAD MOVEMENT
   ========================= */

function updateRoad(delta){

  for(const line of roadLines){

    let y=
      parseFloat(line.style.top);

    y += speed * 0.9 * delta;

    if(y>window.innerHeight+120){
      y=-120;
    }

    line.style.top=y+"px";
  }
}

/* =========================
   TRAFFIC
   ========================= */

function createTraffic(){

  if(!running)return;

  /*
    Keep traffic spread out.
  */

  const car=document.createElement("div");

  const truck=Math.random()<0.13;

  car.className=
    truck ? "car truck" : "car";

  car.style.background=
    colors[
      Math.floor(
        Math.random()*colors.length
      )
    ];

  /*
    Start at a random horizontal
    position across the highway.
  */

  const roadWidth=road.clientWidth;

  const margin=truck ? 55 : 38;

  const x=
    margin+
    Math.random()*
    (roadWidth-margin*2);

  car.style.left=x+"px";

  /*
    Spawn above the screen.
  */

  let y=
    truck ? -150 : -110;

  car.style.top=y+"px";

  /*
    Windows.
  */

  const windowDiv=
    document.createElement("div");

  windowDiv.className="window";

  car.appendChild(windowDiv);

  /*
    Wheels.
  */

  const wheel1=
    document.createElement("div");

  wheel1.className="wheel left";

  car.appendChild(wheel1);

  const wheel2=
    document.createElement("div");

  wheel2.className="wheel right";

  car.appendChild(wheel2);

  road.appendChild(car);

  traffic.push({
    element:car,
    x:x,
    y:y,
    passed:false,
    truck:truck
  });
}

/* =========================
   DRIVER SPEECH
   ========================= */

function driverReaction(car){

  if(!car.element.parentNode)return;

  /*
    Don't make every car shout.
  */

  if(Math.random()<0.2)return;

  const bubble=
    document.createElement("div");

  bubble.className="bubble";

  bubble.textContent=
    reactions[
      Math.floor(
        Math.random()*reactions.length
      )
    ];

  car.element.appendChild(bubble);

  setTimeout(()=>{

    if(bubble.parentNode){
      bubble.remove();
    }

  },2200);
}

/* =========================
   TRAFFIC MOVEMENT
   ========================= */

function updateTraffic(delta){

  for(let i=traffic.length-1;i>=0;i--){

    const car=traffic[i];

    /*
      Traffic comes toward the player.
    */

    car.y +=
      speed *
      (car.truck ? 0.78 : 0.92) *
      delta;

    car.element.style.top=
      car.y+"px";

    /*
      Player passes the car.
    */

    if(
      !car.passed &&
      car.y >
      player.offsetTop+
      player.offsetHeight
    ){

      car.passed=true;

      score+=15;

      /*
        If the car was close horizontally,
        driver gets angry.
      */

      const playerCenter=
        road.clientWidth/2+
        playerX;

      const carCenter=
        car.x;

      const distanceBetween=
        Math.abs(
          playerCenter-carCenter
        );

      if(distanceBetween<85){

        score+=25;

        driverReaction(car);
      }
    }

    /*
      Remove old traffic.
    */

    if(
      car.y>
      window.innerHeight+180
    ){

      car.element.remove();

      traffic.splice(i,1);
    }
  }
}

/* =========================
   COLLISION
   ========================= */

function rectanglesOverlap(a,b){

  const A=
    a.getBoundingClientRect();

  const B=
    b.getBoundingClientRect();

  return !(
    A.right < B.left+8 ||
    A.left > B.right-8 ||
    A.bottom < B.top+12 ||
    A.top > B.bottom-12
  );
}

function checkCollision(){

  for(const car of traffic){

    if(
      rectanglesOverlap(
        player,
        car.element
      )
    ){

      crash();

      return;
    }
  }
}

/* =========================
   CRASH
   ========================= */

function crash(){

  if(!running)return;

  running=false;

  flash.style.opacity=".75";

  setTimeout(()=>{
    flash.style.opacity="0";
  },150);

  finalDistance.textContent=
    Math.floor(distance);

  finalScore.textContent=
    Math.floor(score);

  gameOverScreen.classList.remove(
    "hidden"
  );
}

/* =========================
   GAME LOOP
   ========================= */

function loop(time){

  if(!running)return;

  if(!lastTime){
    lastTime=time;
  }

  let delta=
    (time-lastTime)/16.67;

  /*
    Prevent huge jumps if the browser
    gets paused.
  */

  if(delta>3)delta=3;

  lastTime=time;

  /*
    Distance.
  */

  distance+=
    speed*
    delta*
    0.12;

  /*
    Gradually get faster.
  */

  speed+=
    0.0035*
    delta;

  /*
    Update everything.
  */

  updatePlayer(delta);
  updateRoad(delta);
  updateTraffic(delta);
  checkCollision();

  /*
    HUD.
  */

  distanceText.textContent=
    Math.floor(distance);

  scoreText.textContent=
    Math.floor(score);

  speedText.textContent=
    Math.floor(speed*10);

  const percent=
    Math.min(
      100,
      (speed/25)*100
    );

  speedFill.style.width=
    percent+"%";

  requestAnimationFrame(loop);
}

/* =========================
   SPAWN SYSTEM
   ========================= */

function spawning(delta){

  if(!running)return;

  spawnTimer-=delta;

  if(spawnTimer<=0){

    createTraffic();

    /*
      Sometimes create two cars
      close together.
    */

    if(Math.random()<0.25){

      setTimeout(()=>{

        if(running){
          createTraffic();
        }

      },160);
    }

    /*
      Faster spawning as speed rises.
    */

    const difficulty=
      Math.max(
        360,
        720-
        speed*15
      );

    spawnTimer=
      difficulty;
  }
}

/*
  Separate animation loop for spawning.
*/

let spawnLast=0;

function spawnLoop(time){

  if(!spawnLast){
    spawnLast=time;
  }

  const delta=
    (time-spawnLast);

  spawnLast=time;

  spawning(delta);

  requestAnimationFrame(spawnLoop);
}

/* =========================
   STEERING
   ========================= */

function setSteering(direction){

  steering=direction;
}

function stopSteering(){

  steering=0;
}

/*
  Keyboard
*/

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      setSteering(-1);
    }

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      setSteering(1);
    }

    if(
      e.code==="Space" &&
      !running
    ){

      startGame();
    }
  }
);

document.addEventListener(
  "keyup",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="a" ||
      e.key.toLowerCase()==="d"
    ){

      stopSteering();
    }
  }
);

/*
  Touch buttons
*/

const leftButton=
  document.getElementById("left");

const rightButton=
  document.getElementById("right");

leftButton.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    setSteering(-1);
  }
);

leftButton.addEventListener(
  "pointerup",
  stopSteering
);

leftButton.addEventListener(
  "pointercancel",
  stopSteering
);

rightButton.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    setSteering(1);
  }
);

rightButton.addEventListener(
  "pointerup",
  stopSteering
);

rightButton.addEventListener(
  "pointercancel",
  stopSteering
);

/* =========================
   START / RESTART
   ========================= */

function startGame(){

  /*
    Delete old traffic.
  */

  for(const car of traffic){

    if(car.element.parentNode){
      car.element.remove();
    }
  }

  traffic=[];

  distance=0;
  score=0;

  /*
    Fast starting speed.
  */

  speed=12;

  playerX=0;
  steering=0;

  player.style.left=
    "calc(50% + 0px)";

  startScreen.classList.add(
    "hidden"
  );

  gameOverScreen.classList.add(
    "hidden"
  );

  running=true;

  lastTime=0;

  spawnTimer=200;

  requestAnimationFrame(loop);
}

/* =========================
   BUTTONS
   ========================= */

document
  .getElementById("startButton")
  .addEventListener(
    "click",
    startGame
  );

document
  .getElementById("restartButton")
  .addEventListener(
    "click",
    startGame
  );

/* =========================
   START SYSTEMS
   ========================= */

createRoadLines();

requestAnimationFrame(
  spawnLoop
);
</script>

</body>
                             </html>
