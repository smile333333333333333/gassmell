<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GAS</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#game{
    width:100vw;
    height:100vh;
    display:block;
    background:#222;
}

#menu{
    position:fixed;
    inset:0;
    background:#111;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:100;
}

h1{
    font-size:70px;
    color:#ffcc00;
    margin:0 0 30px;
}

button{
    font-size:28px;
    font-weight:bold;
    padding:20px 50px;
    background:#222;
    color:#ffcc00;
    border:3px solid #ffcc00;
    border-radius:10px;
}

button:active{
    transform:scale(.95);
}

#gameUI{
    position:fixed;
    top:10px;
    left:10px;
    color:white;
    font-size:22px;
    display:none;
    z-index:10;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
    <h1>GAS</h1>
    <button onclick="START_GAME()">START GAME</button>
</div>

<div id="gameUI">
    HEALTH: <span id="health">100</span><br>
    AMMO: <span id="ammo">12</span>
</div>

<script>

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");

var player = {
    x:400,
    y:300,
    speed:5
};

var playing = false;

function resize(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
}

window.addEventListener("resize",resize);

resize();


function START_GAME(){

    console.log("GAME STARTED");

    playing = true;

    document.getElementById("menu").style.display = "none";

    document.getElementById("gameUI").style.display = "block";

    player.x = canvas.width / 2;
    player.y = canvas.height / 2;

    GAME_LOOP();
}


var keys = {};

window.addEventListener("keydown",function(e){

    keys[e.key.toLowerCase()] = true;

});

window.addEventListener("keyup",function(e){

    keys[e.key.toLowerCase()] = false;

});


function UPDATE(){

    if(!playing){
        return;
    }

    if(keys["w"]){
        player.y -= player.speed;
    }

    if(keys["s"]){
        player.y += player.speed;
    }

    if(keys["a"]){
        player.x -= player.speed;
    }

    if(keys["d"]){
        player.x += player.speed;
    }

    player.x = Math.max(20,
        Math.min(canvas.width-20,player.x));

    player.y = Math.max(20,
        Math.min(canvas.height-20,player.y));
}


function DRAW(){

    ctx.fillStyle="#202020";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* floor grid */

    ctx.strokeStyle="#292929";
    ctx.lineWidth=1;

    for(var x=0;x<canvas.width;x+=50){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);
        ctx.stroke();
    }

    for(var y=0;y<canvas.height;y+=50){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);
        ctx.stroke();
    }


    /* player */

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        20,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#3da5ff";

    ctx.fill();

    ctx.strokeStyle="white";
    ctx.lineWidth=3;

    ctx.stroke();


    /* player label */

    ctx.fillStyle="white";
    ctx.font="16px Arial";
    ctx.textAlign="center";

    ctx.fillText(
        "PLAYER",
        player.x,
        player.y-30
    );
}


function GAME_LOOP(){

    if(!playing){
        return;
    }

    UPDATE();

    DRAW();

    requestAnimationFrame(GAME_LOOP);
}

</script>

</body>
</html>
